name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kyverno CLI (pinned)
        run: |
          curl -sSL -o kyverno.tgz https://github.com/kyverno/kyverno/releases/download/v1.10.0/kyverno-cli_v1.10.0_linux_x86_64.tar.gz
          tar -xzf kyverno.tgz kyverno
          sudo mv kyverno /usr/local/bin/
          kyverno version
      - name: Run Kyverno policy tests
        run: kyverno test tests/

  manifest-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy (pinned)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.75.0
          trivy --version
      - name: Trivy scan of the compliant test pod
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 tests/pass-non-root-pod.yaml
