name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kyverno CLI (pinned)
        run: |
          curl -sSL -o kyverno.tgz https://github.com/kyverno/kyverno/releases/download/v1.10.0/kyverno-cli_v1.10.0_linux_x86_64.tar.gz
          tar -xzf kyverno.tgz kyverno
          sudo mv kyverno /usr/local/bin/
          kyverno version
      - name: Run Kyverno policy tests
        run: kyverno test tests/

  manifest-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan of the compliant test pod
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: tests/pass-non-root-pod.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
