name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Schema, Trivy and Kyverno unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load pinned versions
        run: grep -E "^[A-Z_]+=" scripts/versions.env >> "$GITHUB_ENV"

      - name: Install kubeconform and Kyverno CLI
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kyverno

      - name: Validate manifests against schemas
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern 'kyverno-test.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            policies argocd tests

      - name: Install Trivy (pinned release, checksum verified)
        env:
          TRIVY_VERSION: 0.75.0
          # sha256 of trivy_0.75.0_Linux-64bit.tar.gz from the release's checksums file
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          sudo tar xzf trivy.tgz -C /usr/local/bin trivy
          rm trivy.tgz
          trivy --version

      - name: Trivy misconfiguration scan (all manifests)
        run: |
          trivy config . \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-files tests/fail-root-pod.yaml

      - name: Kyverno policy unit tests (offline)
        run: kyverno test tests/

  e2e-kind:
    name: Live admission test on kind
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load pinned versions
        run: grep -E "^[A-Z_]+=" scripts/versions.env >> "$GITHUB_ENV"

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Install Kyverno (pinned chart)
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno
          helm repo update
          # ServiceMonitor CRDs do not exist on a bare kind cluster, so disable them here only.
          helm install kyverno kyverno/kyverno \
            --version "${KYVERNO_CHART_VERSION}" \
            --namespace kyverno --create-namespace \
            -f charts/kyverno-values.yaml \
            --set admissionController.serviceMonitor.enabled=false \
            --set backgroundController.serviceMonitor.enabled=false \
            --set cleanupController.serviceMonitor.enabled=false \
            --set reportsController.serviceMonitor.enabled=false \
            --wait --timeout 5m

      - name: Apply policy and wait until it is Ready
        run: |
          kubectl -n kyverno rollout status deployment/kyverno-admission-controller --timeout=300s
          for i in $(seq 1 30); do
            ep=$(kubectl -n kyverno get endpoints kyverno-svc -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null)
            [ -n "$ep" ] && break
            echo "waiting for kyverno-svc endpoints ($i/30)"; sleep 5
          done
          for i in $(seq 1 10); do
            if kubectl apply -f policies/; then ok=1; break; fi
            echo "webhook not ready, retrying ($i/10)"; sleep 10
          done
          [ "${ok:-0}" = "1" ] || { echo "policies could not be applied"; exit 1; }
          kubectl wait --for=condition=Ready clusterpolicy/disallow-root-user --timeout=120s

      - name: Live deny/allow test
        run: ./scripts/live-test.sh
