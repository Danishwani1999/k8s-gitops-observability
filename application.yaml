apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-policy-engine
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Danishwani1999/k8s-policy-engine.git'
    targetRevision: HEAD
    path: policies
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
