apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-gitops-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Danishwani1999/k8s-gitops-observability.git
    targetRevision: main
    path: policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
