apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zero-trust-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Danishwani1999/k8-s-engine.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

