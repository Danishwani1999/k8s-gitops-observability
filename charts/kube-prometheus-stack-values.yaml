alertmanager:
  enabled: false

defaultRules:
  create: false

nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false

grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      memory: 100Mi
    limits:
      memory: 250Mi

prometheusOperator:
  resources:
    requests:
      memory: 50Mi
    limits:
      memory: 150Mi

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        memory: 600Mi
