alertmanager:
  enabled: false        # not used in this lab; saves Minikube memory

grafana:
  # Lab only. In real use take the admin password from a Secret
  # (grafana.admin.existingSecret) instead of the chart default.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL   # picks up ConfigMaps from any namespace

prometheus:
  prometheusSpec:
    # Without these, Prometheus only scrapes ServiceMonitors that carry the
    # Helm release label - it would silently ignore Kyverno's ServiceMonitors.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 24h
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
