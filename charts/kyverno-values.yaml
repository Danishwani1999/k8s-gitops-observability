admissionController:
  replicas: 1
  serviceMonitor:
    enabled: true
  startupProbe:
    httpGet:
      path: /health/liveness
      port: 9443
      scheme: HTTPS
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 10
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 9443
      scheme: HTTPS
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 9443
      scheme: HTTPS
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 15
    failureThreshold: 10

# Only the admission controller is needed for this lab (see README design decisions).
backgroundController:
  enabled: false
cleanupController:
  enabled: false
reportsController:
  enabled: false
