apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"      # the Grafana sidecar loads every ConfigMap with this label
configMapGenerator:
  - name: kyverno-policy-dashboard
    files:
      - kyverno-policy.json
