apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kyverno-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: kyverno.rules
      rules:
        - alert: KyvernoDeniedRequests
          expr: sum(increase(kyverno_admission_review_duration_seconds_count[10m])) > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "Kyverno processed admission requests"
