apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kyverno-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: kyverno.rules
    rules:
    - alert: KyvernoPolicyViolations
      expr: sum by (policy_name, policy_validation_mode) (increase(kyverno_policy_results_total{rule_result="fail"}[10m])) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Kyverno policy {{ $labels.policy_name }} recorded violations ({{ $labels.policy_validation_mode }} mode)"
