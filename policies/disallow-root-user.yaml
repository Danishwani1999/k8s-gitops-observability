apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/description: >-
      Pods must set runAsNonRoot to true at pod level or on every container.
      Pods that set no user at all are rejected.
spec:
  failurePolicy: Ignore
  background: true
  rules:
    - name: check-runAsNonRoot
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno, argocd, monitoring]
      validate:
        failureAction: Enforce
        message: "Running as root is not allowed. Set securityContext.runAsNonRoot to true at pod or container level."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              =(initContainers):
                - =(securityContext):
                    =(runAsNonRoot): true
              containers:
                - =(securityContext):
                    =(runAsNonRoot): true
          - spec:
              =(initContainers):
                - securityContext:
                    runAsNonRoot: true
              containers:
                - securityContext:
                    runAsNonRoot: true
