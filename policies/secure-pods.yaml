apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root-user
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        clusterScopes: []
        namespaces:
          - kube-system
          - argocd
          - kyverno
          - monitoring
      validate:
        message: "Running as root is not allowed. Pod and all containers must specify runAsNonRoot: true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            =(initContainers):
              - =(securityContext):
                  =(runAsNonRoot): true
            containers:
              - =(securityContext):
                  =(runAsNonRoot): true
