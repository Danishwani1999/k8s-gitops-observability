apiVersion: v1
kind: Pod
metadata:
  name: insecure-root-workload
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsUser: 0 # explicit root: must be denied by disallow-root-user
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
