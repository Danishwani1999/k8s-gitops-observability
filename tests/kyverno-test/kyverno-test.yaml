apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-root-user
policies:
  - ../../policies/disallow-root-user.yaml
resources:
  - ../fail-root-pod.yaml
  - ../pass-non-root-pod.yaml
results:
  - policy: disallow-root-user
    rule: check-run-as-non-root
    kind: Pod
    resources:
      - insecure-root-workload
    result: fail
  - policy: disallow-root-user
    rule: check-run-as-non-root
    kind: Pod
    resources:
      - secure-workload
    result: pass
